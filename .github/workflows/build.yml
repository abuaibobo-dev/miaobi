name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 v1.0.0）'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Inject API Keys
        run: |
          mkdir -p src/config
          cat > src/config/keys.ts << KEYSEOF
          export const INJECTED_KEYS = {
            deepseek: '${{ secrets.DEEPSEEK_KEY }}',
            groq: '${{ secrets.GROQ_KEY }}',
            sambanova: '${{ secrets.SAMBANOVA_KEY }}',
          };
          KEYSEOF
          echo "Keys injected"

      - name: Install dependencies
        run: npm install

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean

      - name: Compute version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        working-directory: android
        run: |
          VERSION="${{ steps.ver.outputs.tag }}"
          VERSION="${VERSION#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          [ -z "$PATCH" ] && PATCH=0
          CODE=$((MAJOR*10000 + MINOR*100 + PATCH))
          VERSION_NAME="$VERSION" VERSION_CODE="$CODE" ./gradlew assembleRelease --no-daemon

      - name: Copy APK
        run: |
          mkdir -p dist
          TAG="${{ steps.ver.outputs.tag }}"
          cp android/app/build/outputs/apk/release/app-release.apk "dist/MiaoBi-$TAG.apk"

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          gh release create "$TAG" "dist/MiaoBi-$TAG.apk" \
            --repo "${{ github.repository }}" \
            --title "妙笔 $TAG" \
            --notes "成人文学 · 全网书源 · 本地阅读" || \
          gh release upload "$TAG" "dist/MiaoBi-$TAG.apk" --repo "${{ github.repository }}" --clobber
