name: Build APK

on:
  push:
    branches: [master]
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Inject Keys
        run: |
          mkdir -p src/config
          cat > src/config/keys.ts << 'KEYS'
          export const INJECTED_KEYS: Record<string, string> = {};
          KEYS

      - run: npm install

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npx vitest run

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - run: npx expo prebuild --platform android --clean

      - name: Version
        id: ver
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          [ "$TAG" = "$GITHUB_REF" ] && TAG="v$(grep '"version"' package.json | head -1 | sed 's/.*"\(.*\)".*/\1/')"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build
        working-directory: android
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          VER="${TAG#v}"
          MAJOR=$(echo "$VER" | cut -d. -f1)
          MINOR=$(echo "$VER" | cut -d. -f2)
          PATCH=$(echo "$VER" | cut -d. -f3)
          [ -z "$PATCH" ] && PATCH=0
          CODE=$((MAJOR*10000+MINOR*100+PATCH))
          VERSION_NAME="$VER" VERSION_CODE="$CODE" ./gradlew assembleRelease --no-daemon

      - name: Download Pi Agent
        run: |
          curl -sL "https://github.com/Dicklesworthstone/pi_agent_rust/releases/download/v0.3.0/pi-linux-arm64.tar.xz" -o /tmp/pi.tar.xz
          tar xf /tmp/pi.tar.xz -C /tmp
          cp /tmp/pi-0.3.0-aarch64-unknown-linux-gnu/pi pi-agent-arm64
          chmod +x pi-agent-arm64

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/MiaoBi-$TAG.apk"
          cp pi-agent-arm64 dist/
          gh release create "$TAG" dist/MiaoBi-$TAG.apk dist/pi-agent-arm64 \
            --repo "${{ github.repository }}" \
            --title "妙笔 $TAG" \
            --notes "APK + Pi Agent ARM64" || \
          gh release upload "$TAG" dist/MiaoBi-$TAG.apk dist/pi-agent-arm64 \
            --repo "${{ github.repository }}" --clobber
